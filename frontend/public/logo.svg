<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 主渐变：量子蓝到极光紫，兼顾纯净现代与科技感 -->
    <linearGradient id="jie-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- 枢纽能量核渐变：耀目暖橙 -->
    <linearGradient id="jie-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- 柔和质感微辉光 -->
    <filter id="jie-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-opacity="0.18" flood-color="#3B82F6" />
    </filter>
  </defs>

  <g filter="url(#jie-glow)">
    <!-- 外层 Hub 互联环轨道（精算开环与负空间，象征开放生态） -->
    <path
      d="M 68 28 C 82 42, 82 66, 66 80 C 50 94, 24 92, 14 74 C 6 58, 12 36, 28 22 C 38 14, 52 14, 62 18"
      stroke="url(#jie-grad-primary)"
      stroke-width="4.2"
      stroke-linecap="round"
      opacity="0.4"
    />

    <!-- 核心主体：极简字母 J 垂直主干与利落收角弧钩 -->
    <path
      d="M 52 24 L 52 64 C 52 74, 42 82, 30 78 C 22 75, 18 66, 20 58"
      stroke="url(#jie-grad-primary)"
      stroke-width="6.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 动态横向速度切线：暗含 i 与 e 的空间张力 -->
    <path
      d="M 38 36 L 70 36 L 54 52 L 74 72"
      stroke="url(#jie-grad-primary)"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.8"
    />

    <!-- Hub 核心枢纽节点 (Hub Core) -->
    <circle cx="72" cy="24" r="5" fill="url(#jie-grad-accent)" />
    <circle cx="72" cy="24" r="8" stroke="url(#jie-grad-accent)" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>
