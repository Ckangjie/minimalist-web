<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 左侧代码开括号渐变：逻辑青绿 -> 科技蔚蓝 -->
    <linearGradient id="jie-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- 中间核心大写字母 J 渐变：科技蔚蓝 -> 极客靛蓝 -> 极光紫 -->
    <linearGradient id="jie-grad-j" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- 右侧点睛闭括号渐变：极光紫 -> 霓虹玫红 -->
    <linearGradient id="jie-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- 高级现代轻景深立体微阴影 -->
    <filter id="jie-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-opacity="0.25" flood-color="#3B82F6" />
    </filter>
  </defs>

  <g filter="url(#jie-shadow)">
    <!-- 1. 左侧代码开标签 < (舒展纯粹的代码开端) -->
    <path
      d="M 30 26 L 14 48 L 30 70"
      stroke="url(#jie-grad-left)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 2. 中间核心：纯正大写字母 J (顶部代码横梁光标，主干垂直挺拔，底部优雅回弯) -->
    <path
      d="M 46 20 L 60 20 L 60 58 C 60 70 52 79 42 79 C 35 79 34 74 36 68"
      stroke="url(#jie-grad-j)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3. 右侧点睛代码闭标签 > (灵动微缩，构成完整代码语法生态) -->
    <path
      d="M 72 36 L 85 46 L 72 56"
      stroke="url(#jie-grad-right)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
